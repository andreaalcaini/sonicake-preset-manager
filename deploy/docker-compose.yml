# Production stack for the Linux ARM64 VPS (Oracle Ampere):
#   caddy    -> HTTPS (automatic Let's Encrypt) for the static site (dist/) + /api reverse proxy
#   compiler -> NAM -> CLO converter (server/Dockerfile), reachable only from caddy
#
# Usage on the VPS (from the repo root, after `npm run build` produced dist/):
#   docker compose -f deploy/docker-compose.yml up -d
# The public domain comes from deploy/.env (SITE_DOMAIN=sonicake.alcaini.it).
services:
  compiler:
    image: sonicake-compiler:latest
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NAM2CLO_WORKERS: "2"
    volumes:
      - compiler-cache:/app/cache
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - compiler
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN to the public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  compiler-cache:
  caddy-data:
  caddy-config:
